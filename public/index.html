<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>multiagent-town 像素小镇</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="hud">
    <div id="brand"><b>EMERGENCE</b> CONSOLE</div>
    <div id="clock">第1天 00:00</div>
    <div class="spacer"></div>
    <div class="seg">
      <button id="view-narrative" class="active">🎭 叙事</button>
      <button id="view-map">🗺 地图</button>
      <button id="view-net">🕸 网络</button>
      <button id="view-metrics">📈 指标</button>
    </div>
    <div class="seg" id="controls">
      <button data-action="pause">⏸ 暂停</button>
      <button data-action="speed" data-value="1">1x</button>
      <button data-action="speed" data-value="60">60x</button>
      <button data-action="speed" data-value="360">360x</button>
    </div>
  </div>

  <aside id="rail">
    <div class="card">
      <h4>平行世界</h4>
      <select id="world-select" style="width:100%;background:var(--bg-2);border:1px solid var(--panel-edge);border-radius:6px;color:var(--ink);padding:6px;font-family:var(--mono)"></select>
      <div style="font-size:11px;color:var(--ink-dim);margin-top:6px" id="world-desc"></div>
    </div>
    <div class="card" id="run-status"><div class="dot"></div>实验：<b>未运行</b></div>
    <div class="card">
      <h4>实验配置</h4>
      <div class="switch-row"><label>关系记忆</label>
        <label class="switch"><input type="checkbox" id="exp-mem" checked /><span class="knob"></span></label></div>
      <div class="switch-row"><label>馈礼交换</label>
        <label class="switch"><input type="checkbox" id="exp-gift" checked /><span class="knob"></span></label></div>
      <div class="field-row" style="margin-bottom:10px"><span>天数</span>
        <input id="exp-days" type="number" value="30" min="1" max="365" /></div>
      <div class="rail-actions">
        <button class="icon-btn primary" id="exp-start">▶ 开始</button>
        <button class="icon-btn danger" id="exp-stop">■ 停止</button>
        <button class="icon-btn" id="exp-export" style="grid-column:1/-1">💾 导出指标 JSON</button>
      </div>
    </div>
    <div class="card">
      <h4>居民名册</h4>
      <div id="roster"></div>
    </div>
  </aside>

  <main id="stage">
    <div id="narrative"></div>
    <canvas id="game" style="display:none"></canvas>
    <canvas id="net-canvas"></canvas>
    <canvas id="metrics-canvas"></canvas>
  </main>

  <aside id="feed">
    <h4>角色详情</h4>
    <div id="character-card" style="color:var(--ink-dim);font-size:12px">点击左侧名册或对话头像查看角色</div>
  </aside>

  <div id="side">
    <div id="panel">
      <div id="panel-tabs">
        <button data-tab="detail" class="tab active">详情</button>
        <button data-tab="profile" class="tab">档案</button>
        <button data-tab="memory" class="tab">记忆</button>
        <button data-tab="reflection" class="tab">反思</button>
        <button data-tab="dialogue" class="tab">对话</button>
        <button data-tab="relation" class="tab">关系</button>
      </div>
      <div id="panel-body"><p id="panel-empty" style="color:var(--ink-dim)">点击小镇里的角色查看详情</p></div>
    </div>
  </div>
  <div id="play-bar" hidden>
    <input id="play-input" placeholder="输入指令，如：去告诉陈默今晚派对" maxlength="120" />
    <button id="play-send">执行</button>
    <button id="play-exit">退出扮演</button>
  </div>
  <script src="/client.js"></script>
</body>
